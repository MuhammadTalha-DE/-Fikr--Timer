<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fikr Timer Pro</title>
    <meta name="theme-color" content="#7c5ce7">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    
</head>
<body>
    <div id="app">
        <header class="glass-header">
            <div class="logo">
                <span class="logo-icon">⏳</span>
                <h1>Fikr Timer</h1>
            </div>
            <div class="header-controls">
                <button id="soundscapeBtn" class="icon-btn" title="Soundscape">🎧</button>
                <button id="themeBtn" class="icon-btn" title="Theme">🌓</button>
                <button id="layoutBtn" class="icon-btn" title="Desktop Mode">🖥️</button>
            </div>
        </header>

        <main id="mainContent"></main>

        <nav class="bottom-nav">
            <button data-view="home" class="nav-item active">🏠<span>Modes</span></button>
            <button data-view="timer" class="nav-item">⏱️<span>Timer</span></button>
            <button data-view="analytics" class="nav-item">📊<span>Stats</span></button>
            <button data-view="settings" class="nav-item">⚙️<span>Settings</span></button>
        </nav>

        <!-- Modals will be injected dynamically -->
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
