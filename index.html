<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fikr Timer — Ultimate</title>
    <meta name="theme-color" content="#7c5ce7">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #0b0b1a;
            --surface: rgba(20,20,40,0.7);
            --surface2: rgba(35,35,60,0.9);
            --text: #f0f0ff;
            --text-secondary: #b0b0d0;
            --primary: #7c5ce7;
            --primary-glow: 0 0 25px rgba(124,92,231,0.5);
            --danger: #f87171;
            --success: #4ade80;
            --border: rgba(255,255,255,0.1);
            --radius: 24px;
            --transition: 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            --glass-bg: rgba(255,255,255,0.05);
        }
        [data-theme="light"] {
            --bg: #f4f4ff;
            --surface: rgba(255,255,255,0.8);
            --surface2: rgba(240,240,255,0.95);
            --text: #1a1a2e;
            --text-secondary: #4a4a6a;
            --primary: #5a3ec8;
            --primary-glow: 0 0 20px rgba(90,62,200,0.4);
            --glass-bg: rgba(0,0,0,0.03);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; flex-direction: column;
            transition: background 0.3s, color 0.3s;
            user-select: none; -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .header {
            background: var(--surface); backdrop-filter: blur(20px);
            padding: 12px 20px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid var(--border);
            position: sticky; top:0; z-index:100;
        }
        .header h1 {
            font-weight: 800; background: linear-gradient(135deg, var(--primary), #c084fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .icon-btn {
            background: var(--glass-bg); border: none; font-size: 1.4rem;
            padding: 8px; border-radius: 40px; color: var(--text);
            cursor: pointer; transition: 0.2s;
        }
        .icon-btn:hover { background: var(--primary); color: white; transform: scale(1.1); }
        .main { flex: 1; overflow-y: auto; padding: 20px 16px 100px; }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--surface); backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding: 10px;
            z-index: 100;
        }
        .nav-item {
            background: none; border: none; color: var(--text-secondary);
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            font-size: 0.75rem; cursor: pointer;
        }
        .nav-item.active { color: var(--primary); font-weight: 600; }
        .view { display: none; }
        .view.active { display: block; }
        .mode-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr));
            gap: 14px; margin-bottom: 24px;
        }
        .mode-card {
            background: var(--glass-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: 20px; text-align: center; cursor: pointer;
            transition: all var(--transition);
            transform-style: preserve-3d;
        }
        .mode-card:hover {
            transform: translateY(-3px) rotateY(5deg);
            border-color: var(--primary);
            box-shadow: var(--primary-glow);
        }
        .mode-icon { font-size: 2.5rem; margin-bottom: 8px; }
        .mode-name { font-weight: 600; }
        .timer-circle {
            position: relative; width: 260px; height: 260px; margin: 20px auto;
        }
        .timer-circle.breathing-inhale { transform: scale(1.08); transition: transform 0.6s ease; }
        .timer-circle.breathing-exhale { transform: scale(0.95); transition: transform 0.6s ease; }
        .timer-circle.breathing-hold { transform: scale(1); transition: transform 0.6s ease; }
        .timer-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .timer-bg { fill: none; stroke: var(--border); stroke-width: 6; }
        .timer-progress {
            fill: none; stroke: var(--primary); stroke-width: 6;
            stroke-linecap: round; transition: stroke-dashoffset 0.3s linear;
        }
        .breathing-ring {
            fill: none; stroke: var(--primary); stroke-width: 2;
            opacity: 0; transition: r 0.6s ease, opacity 0.3s;
        }
        .timer-time {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); font-size: 3rem; font-weight: 700;
            z-index: 1;
        }
        .timer-label {
            position: absolute; top: 62%; left: 50%;
            transform: translate(-50%, 0); color: var(--text-secondary);
            font-size: 0.9rem; z-index: 1;
        }
        .breathing-phase-text {
            position: absolute; top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.6rem; font-weight: 300; letter-spacing: 3px;
            color: var(--primary); z-index: 1; display: none;
        }
        .controls {
            display: flex; justify-content: center; align-items: center; gap: 20px;
            margin: 20px 0;
        }
        .ctrl-btn {
            background: var(--glass-bg); border: none; border-radius: 50%;
            width: 55px; height: 55px; font-size: 1.4rem; color: var(--text);
            cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .ctrl-btn.start { width: 70px; height: 70px; font-size: 2rem; background: var(--primary); color: white; }
        .ctrl-btn:hover { background: var(--primary); color: white; }
        .extra-controls { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .btn {
            padding: 8px 18px; border-radius: 40px; font-weight: 600;
            cursor: pointer; border: none; background: var(--primary);
            color: white; transition: 0.2s;
        }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: var(--surface2); }
        .breathing-panel {
            background: var(--surface); border-radius: var(--radius);
            padding: 16px; margin-top: 20px; display: none;
            border: 1px solid var(--border);
        }
        .breathing-panel.active { display: grid; }
        .control-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 10px;
        }
        .control-label { font-weight: 500; width: 70px; }
        .nudge-btn {
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: 20px; width: 32px; height: 32px; font-size: 1.2rem;
            color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .nudge-value { font-weight: 600; width: 30px; text-align: center; }
        .presets { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .preset-btn { background: var(--surface2); border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; cursor: pointer; color: var(--text); font-size: 0.85rem; }
        .preset-btn:hover { background: var(--primary); color: white; }
        canvas#particleCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; border-radius: 50%;
        }
        .soundscape-btn { margin: 10px; }
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px); display: flex; align-items: center;
            justify-content: center; z-index: 200; display: none;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--surface2); border-radius: var(--radius);
            padding: 24px; max-width: 90vw; width: 350px; text-align: center;
        }
        .history-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid var(--border); }
        .heatmap { display: flex; gap: 4px; flex-wrap: wrap; }
        .heat-cell { width: 12px; height: 12px; border-radius: 2px; }
        @media (max-width: 480px) {
            .mode-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>⏳ Fikr Timer</h1>
        <div>
            <button id="soundscapeBtn" class="icon-btn" title="Ambient Sound">🎧</button>
            <button id="themeBtn" class="icon-btn">🌓</button>
        </div>
    </header>

    <main class="main" id="mainContent"></main>

    <nav class="bottom-nav">
        <button class="nav-item active" data-view="home">🏠 Modes</button>
        <button class="nav-item" data-view="timer">⏱️ Timer</button>
        <button class="nav-item" data-view="analytics">📊 Stats</button>
    </nav>

    <div class="modal" id="summaryModal">
        <div class="modal-content">
            <h2>🎉 Session Complete</h2>
            <div id="summaryDetails"></div>
            <button class="btn" id="closeSummary">OK</button>
        </div>
    </div>

    <script>
        // ===================== MODES CONFIG =====================
        const MODES = [
            { id: 'pomodoro', name: 'Pomodoro', icon: '🍅', defaults: { focus: 25, break: 5, longBreak: 15, rounds: 4 } },
            { id: 'study', name: 'Study Mode', icon: '📚', defaults: { focus: 50, break: 10 } },
            { id: 'deepwork', name: 'Deep Work', icon: '🧠', defaults: { focus: 90, break: 15 } },
            { id: 'countdown', name: 'Countdown', icon: '⏲️', defaults: { focus: 30 } },
            { id: 'stopwatch', name: 'Stopwatch', icon: '⏱️', defaults: {} },
            { id: 'interval', name: 'Interval', icon: '🔄', defaults: { focus: 30, break: 10, rounds: 6 } },
            { id: 'exam', name: 'Exam Mode', icon: '📝', defaults: { questions: 20, time: 60 } },
            { id: 'reading', name: 'Reading', icon: '📖', defaults: { pages: 30, time: 30 } },
            { id: 'coding', name: 'Coding Sprint', icon: '💻', defaults: { focus: 45 } },
            { id: 'workout', name: 'Workout', icon: '💪', defaults: { exercise: 45, rest: 15, rounds: 8 } },
            { id: 'breathing', name: 'Breathing', icon: '🧘', defaults: { inhale: 4, hold: 4, exhale: 4, hold2: 4, cycles: 5 } },
            { id: 'prayer', name: 'Prayer/Break', icon: '🙏', defaults: { focus: 10, break: 2 } },
            { id: 'custom', name: 'Custom', icon: '⚙️', defaults: { focus: 30, break: 5, rounds: 4 } }
        ];

        // ===================== STATE =====================
        let currentMode = null;
        let timerInterval = null;
        let timeLeft = 0, totalDuration = 0, isRunning = false;
        let isBreak = false, currentRound = 1, totalRounds = 1;
        let sessionData = { mode: '', startTime: null, distractions: 0, score: 0 };
        let soundEnabled = true;
        let breathingParams = { inhale: 4, hold: 4, exhale: 4, hold2: 4, cycles: 5 };
        let breathingPhases = [], breathingPhaseIdx = 0, breathingCycle = 0, breathingMaxCycles = 0;
        let particleCanvas, ctx, particles = [], animFrame;
        // Soundscape
        let ambientAudio = null;
        let ambientType = 'none';

        // ===================== UTILS =====================
        function formatTime(sec) {
            const m = Math.floor(sec / 60), s = sec % 60;
            return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }
        function playSound(type = 'complete') {
            if (!soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = type === 'complete' ? 880 : 660;
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }
        function saveHistory(session) {
            let history = JSON.parse(localStorage.getItem('fikr_history') || '[]');
            history.unshift(session);
            localStorage.setItem('fikr_history', JSON.stringify(history.slice(0, 100)));
        }

        // ===================== NAVIGATION =====================
        let currentView = 'home';
        const main = document.getElementById('mainContent');
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(btn => {
            btn.addEventListener('click', () => {
                currentView = btn.dataset.view;
                navItems.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderView();
            });
        });

        function renderView() {
            main.innerHTML = '';
            if (currentView === 'home') renderHome();
            else if (currentView === 'timer') renderTimer();
            else if (currentView === 'analytics') renderAnalytics();
        }

        // ===================== HOME VIEW =====================
        function renderHome() {
            main.innerHTML = `
                <div class="view active">
                    <h2>Choose Your Mode</h2>
                    <div class="mode-grid" id="modeGrid"></div>
                </div>`;
            const grid = document.getElementById('modeGrid');
            grid.innerHTML = MODES.map(m => `
                <div class="mode-card" data-mode="${m.id}">
                    <div class="mode-icon">${m.icon}</div>
                    <div class="mode-name">${m.name}</div>
                </div>`).join('');
            document.querySelectorAll('.mode-card').forEach(card => {
                card.addEventListener('click', () => {
                    startMode(card.dataset.mode);
                    currentView = 'timer';
                    navItems.forEach(b => b.classList.remove('active'));
                    document.querySelector(`[data-view="timer"]`).classList.add('active');
                    renderView();
                });
            });
        }

        // ===================== TIMER VIEW =====================
        function renderTimer() {
            const mode = currentMode || MODES[0];
            main.innerHTML = `
                <div class="view active timer-container">
                    <h2 style="text-align:center;">${mode.icon} ${mode.name}</h2>
                    <div style="text-align:center; color:var(--text-secondary);" id="roundInfo">${getRoundInfo()}</div>
                    <div class="timer-circle" id="timerCircle">
                        <canvas id="particleCanvas"></canvas>
                        <svg class="timer-svg" viewBox="0 0 200 200">
                            <circle class="timer-bg" cx="100" cy="100" r="90"/>
                            <circle class="timer-progress" id="progressCircle" cx="100" cy="100" r="90" stroke-dasharray="565.5" stroke-dashoffset="0"/>
                            <circle class="breathing-ring" id="breathRing" cx="100" cy="100" r="40"/>
                        </svg>
                        <div class="timer-time" id="timerTime">${formatTime(timeLeft)}</div>
                        <div class="timer-label" id="timerLabel">${getTimerLabel()}</div>
                        <div class="breathing-phase-text" id="breathingPhaseText" style="display:${mode.id === 'breathing' ? 'block' : 'none'};">INHALE</div>
                    </div>
                    <div class="controls">
                        <button class="ctrl-btn" id="btnReset">↺</button>
                        <button class="ctrl-btn start" id="btnStart">${isRunning ? '⏸' : '▶'}</button>
                        <button class="ctrl-btn" id="btnAdd5">+5</button>
                    </div>
                    <div class="extra-controls">
                        <button class="btn btn-outline" id="btnSkip">Skip Break</button>
                        <button class="btn btn-outline" id="btnEnd">End Session</button>
                        <button class="btn btn-outline soundscape-btn" id="btnSoundscape">🎧 Ambient</button>
                    </div>
                    <div class="breathing-panel ${mode.id === 'breathing' ? 'active' : ''}" id="breathingPanel">
                        <div class="control-row">
                            <span class="control-label">Inhale</span>
                            <button class="nudge-btn" data-phase="inhale" data-dir="-">−</button>
                            <span class="nudge-value" id="inhaleVal">${breathingParams.inhale}</span>
                            <button class="nudge-btn" data-phase="inhale" data-dir="+">+</button>
                        </div>
                        <div class="control-row">
                            <span class="control-label">Hold</span>
                            <button class="nudge-btn" data-phase="hold" data-dir="-">−</button>
                            <span class="nudge-value" id="holdVal">${breathingParams.hold}</span>
                            <button class="nudge-btn" data-phase="hold" data-dir="+">+</button>
                        </div>
                        <div class="control-row">
                            <span class="control-label">Exhale</span>
                            <button class="nudge-btn" data-phase="exhale" data-dir="-">−</button>
                            <span class="nudge-value" id="exhaleVal">${breathingParams.exhale}</span>
                            <button class="nudge-btn" data-phase="exhale" data-dir="+">+</button>
                        </div>
                        <div class="control-row">
                            <span class="control-label">Hold</span>
                            <button class="nudge-btn" data-phase="hold2" data-dir="-">−</button>
                            <span class="nudge-value" id="hold2Val">${breathingParams.hold2}</span>
                            <button class="nudge-btn" data-phase="hold2" data-dir="+">+</button>
                        </div>
                        <div class="control-row">
                            <span class="control-label">Cycles</span>
                            <button class="nudge-btn" data-phase="cycles" data-dir="-">−</button>
                            <span class="nudge-value" id="cyclesVal">${breathingParams.cycles}</span>
                            <button class="nudge-btn" data-phase="cycles" data-dir="+">+</button>
                        </div>
                        <div class="presets">
                            <button class="preset-btn" data-preset="box">Box (4-4-4-4)</button>
                            <button class="preset-btn" data-preset="478">4-7-8</button>
                            <button class="preset-btn" data-preset="deep">Deep (5-5-5-5)</button>
                        </div>
                    </div>
                    <button class="btn btn-outline" style="margin:20px auto; display:block;" id="btnBack">← Back to Modes</button>
                </div>`;

            // Particles setup
            particleCanvas = document.getElementById('particleCanvas');
            if (particleCanvas) {
                particleCanvas.width = particleCanvas.parentElement.offsetWidth;
                particleCanvas.height = particleCanvas.parentElement.offsetHeight;
                ctx = particleCanvas.getContext('2d');
                initParticles();
            }

            // Event listeners
            document.getElementById('btnStart').addEventListener('click', toggleTimer);
            document.getElementById('btnReset').addEventListener('click', resetTimer);
            document.getElementById('btnAdd5').addEventListener('click', addFiveMinutes);
            document.getElementById('btnSkip').addEventListener('click', skipBreak);
            document.getElementById('btnEnd').addEventListener('click', endSession);
            document.getElementById('btnBack').addEventListener('click', () => {
                stopTimer();
                cancelAnimationFrame(animFrame);
                stopAmbient();
                currentView = 'home';
                navItems.forEach(b => b.classList.remove('active'));
                document.querySelector(`[data-view="home"]`).classList.add('active');
                renderView();
            });
            document.getElementById('btnSoundscape').addEventListener('click', toggleAmbientSound);

            // Breathing controls
            document.querySelectorAll('.nudge-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const phase = btn.dataset.phase;
                    const dir = btn.dataset.dir === '+' ? 1 : -1;
                    breathingParams[phase] = Math.max(1, breathingParams[phase] + dir);
                    document.getElementById(`${phase}Val`).textContent = breathingParams[phase];
                    if (currentMode && currentMode.id === 'breathing') {
                        rebuildBreathingPhases();
                        updateBreathingUI();
                    }
                });
            });
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const preset = btn.dataset.preset;
                    if (preset === 'box') breathingParams = { inhale:4, hold:4, exhale:4, hold2:4, cycles:5 };
                    else if (preset === '478') breathingParams = { inhale:4, hold:7, exhale:8, hold2:0, cycles:5 };
                    else if (preset === 'deep') breathingParams = { inhale:5, hold:5, exhale:5, hold2:5, cycles:5 };
                    updateBreathingControlPanel();
                    if (currentMode && currentMode.id === 'breathing') {
                        rebuildBreathingPhases();
                        updateBreathingUI();
                    }
                });
            });

            updateProgress();
            if (currentMode && currentMode.id === 'breathing') updateBreathingUI();
        }

        function getTimerLabel() {
            if (!currentMode) return 'Focus';
            if (currentMode.id === 'stopwatch') return 'Stopwatch';
            if (currentMode.id === 'breathing') return '';
            return isBreak ? 'Break' : 'Focus';
        }
        function getRoundInfo() {
            if (!currentMode) return '';
            if (currentMode.id === 'breathing') return `Cycle ${breathingCycle+1}/${breathingMaxCycles}`;
            if (totalRounds > 1) return `Round ${currentRound}/${totalRounds}`;
            return '';
        }

        // ===================== BREATHING HELPERS =====================
        function rebuildBreathingPhases() {
            breathingPhases = [];
            breathingPhases.push({ name: 'Inhale', duration: breathingParams.inhale });
            if (breathingParams.hold > 0) breathingPhases.push({ name: 'Hold', duration: breathingParams.hold });
            breathingPhases.push({ name: 'Exhale', duration: breathingParams.exhale });
            if (breathingParams.hold2 > 0) breathingPhases.push({ name: 'Hold', duration: breathingParams.hold2 });
            breathingMaxCycles = breathingParams.cycles;
        }
        function updateBreathingControlPanel() {
            const ids = ['inhale','hold','exhale','hold2','cycles'];
            ids.forEach(id => {
                const el = document.getElementById(`${id}Val`);
                if (el) el.textContent = breathingParams[id];
            });
        }
        function updateBreathingUI() {
            if (!currentMode || currentMode.id !== 'breathing') return;
            const phase = breathingPhases[breathingPhaseIdx];
            const phaseText = document.getElementById('breathingPhaseText');
            if (phaseText) phaseText.textContent = phase.name.toUpperCase();
            const circle = document.getElementById('timerCircle');
            circle.classList.remove('breathing-inhale','breathing-exhale','breathing-hold');
            if (phase.name === 'Inhale') circle.classList.add('breathing-inhale');
            else if (phase.name === 'Exhale') circle.classList.add('breathing-exhale');
            else circle.classList.add('breathing-hold');
            const ring = document.getElementById('breathRing');
            if (ring) {
                if (phase.name === 'Inhale') {
                    ring.setAttribute('r', '85'); ring.style.opacity = '0.5';
                } else if (phase.name === 'Exhale') {
                    ring.setAttribute('r', '35'); ring.style.opacity = '0.2';
                } else {
                    ring.setAttribute('r', '50'); ring.style.opacity = '0.3';
                }
                ring.style.transition = `r ${phase.duration}s ease, opacity 0.3s`;
            }
            if (phase.name === 'Inhale') animateParticles('up');
            else if (phase.name === 'Exhale') animateParticles('down');
            else animateParticles('still');
        }

        // ===================== PARTICLES =====================
        function initParticles() {
            if (!particleCanvas) return;
            const w = particleCanvas.width, h = particleCanvas.height;
            particles = Array.from({length: 60}, () => ({
                x: Math.random() * w, y: Math.random() * h,
                r: Math.random() * 3 + 1,
                vx: (Math.random() - 0.5) * 0.5, vy: 0, baseVx: (Math.random() - 0.5) * 0.5
            }));
            if (ctx) drawParticles();
        }
        function drawParticles() {
            if (!ctx || !particleCanvas) return;
            ctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > particleCanvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > particleCanvas.height) p.vy *= -1;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                ctx.fillStyle = `rgba(124,92,231,${0.3 + Math.sin(Date.now()/500)*0.2})`;
                ctx.fill();
            });
            animFrame = requestAnimationFrame(drawParticles);
        }
        function animateParticles(dir) {
            particles.forEach(p => {
                if (dir === 'up') {
                    p.vy = -Math.random() * 2 - 1;
                    p.vx = p.baseVx;
                } else if (dir === 'down') {
                    p.vy = Math.random() * 2 + 1;
                    p.vx = p.baseVx;
                } else {
                    p.vy *= 0.95; p.vx *= 0.95;
                }
            });
        }

        // ===================== AMBIENT SOUNDSCAPES =====================
        function toggleAmbientSound() {
            if (ambientAudio) {
                stopAmbient();
                document.getElementById('btnSoundscape').textContent = '🎧 Ambient';
                return;
            }
            // Simple ambient noise (white noise) using Web Audio API
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const bufferSize = 4096;
            const noise = ctx.createScriptProcessor(bufferSize, 1, 1);
            noise.onaudioprocess = (e) => {
                const out = e.outputBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    out[i] = Math.random() * 0.1; // white noise
                }
            };
            const gain = ctx.createGain();
            gain.gain.value = 0.08;
            noise.connect(gain);
            gain.connect(ctx.destination);
            ambientAudio = { ctx, noise, gain };
            document.getElementById('btnSoundscape').textContent = '🎧 Stop Ambient';
        }
        function stopAmbient() {
            if (ambientAudio) {
                ambientAudio.noise.disconnect();
                ambientAudio.gain.disconnect();
                ambientAudio = null;
            }
        }

        // ===================== TIMER ENGINE =====================
        function startMode(modeId, customParams = {}) {
            const mode = MODES.find(m => m.id === modeId);
            if (!mode) return;
            currentMode = mode;
            stopTimer();
            cancelAnimationFrame(animFrame);
            isBreak = false;
            currentRound = 1;
            sessionData = { mode: mode.name, startTime: Date.now(), distractions: 0, score: 0 };
            const defs = mode.defaults;
            if (modeId === 'breathing') {
                breathingParams = {
                    inhale: parseInt(customParams.inhale || defs.inhale),
                    hold: parseInt(customParams.hold ?? defs.hold),
                    exhale: parseInt(customParams.exhale || defs.exhale),
                    hold2: parseInt(customParams.hold2 ?? defs.hold2),
                    cycles: parseInt(customParams.cycles || defs.cycles)
                };
                rebuildBreathingPhases();
                breathingPhaseIdx = 0;
                breathingCycle = 0;
                timeLeft = breathingPhases[0].duration;
                totalDuration = timeLeft;
                totalRounds = breathingMaxCycles;
            } else {
                switch (modeId) {
                    case 'pomodoro': timeLeft = defs.focus * 60; totalRounds = defs.rounds; break;
                    case 'study': timeLeft = (customParams.focus || defs.focus) * 60; totalRounds = 1; break;
                    case 'deepwork': timeLeft = defs.focus * 60; totalRounds = 1; break;
                    case 'countdown': timeLeft = (customParams.duration || defs.focus) * 60; totalRounds = 1; break;
                    case 'stopwatch': timeLeft = 0; totalRounds = 1; break;
                    case 'interval': timeLeft = defs.focus * 60; totalRounds = defs.rounds; break;
                    case 'exam': timeLeft = (customParams.time || defs.time) * 60; totalRounds = 1; break;
                    case 'reading': timeLeft = (customParams.time || defs.time) * 60; totalRounds = 1; break;
                    case 'coding': timeLeft = (customParams.duration || defs.focus) * 60; totalRounds = 1; break;
                    case 'workout': timeLeft = (customParams.exercise || defs.exercise); totalRounds = customParams.rounds || defs.rounds; break;
                    case 'prayer': timeLeft = defs.focus * 60; totalRounds = 1; break;
                    case 'custom': timeLeft = (customParams.focus || defs.focus) * 60; totalRounds = customParams.rounds || defs.rounds; break;
                    default: timeLeft = 1500; totalRounds = 1;
                }
                totalDuration = timeLeft;
            }
            isRunning = false;
            updateDisplay();
            updateProgress(1);
            document.title = 'Fikr Timer';
        }

        function toggleTimer() {
            if (!currentMode) return;
            if (isRunning) { stopTimer(); return; }
            isRunning = true;
            document.getElementById('btnStart').textContent = '⏸';
            timerInterval = setInterval(tick, 1000);
        }
        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;
            const startBtn = document.getElementById('btnStart');
            if (startBtn) startBtn.textContent = '▶';
        }
        function tick() {
            if (!isRunning) return;
            if (currentMode.id === 'stopwatch') {
                timeLeft++;
                updateDisplay();
                return;
            }
            if (timeLeft <= 0) { handleTimerEnd(); return; }
            timeLeft--;
            updateDisplay();
            updateProgress(timeLeft / totalDuration);
            document.title = `${formatTime(timeLeft)} - Fikr`;
        }
        function updateDisplay() {
            const timeEl = document.getElementById('timerTime');
            if (timeEl) timeEl.textContent = formatTime(timeLeft);
            const labelEl = document.getElementById('timerLabel');
            if (labelEl) labelEl.textContent = getTimerLabel();
            const roundInfo = document.getElementById('roundInfo');
            if (roundInfo) roundInfo.textContent = getRoundInfo();
        }
        function updateProgress(ratio) {
            const circle = document.getElementById('progressCircle');
            if (!circle) return;
            circle.style.strokeDashoffset = 565.5 * (1 - Math.min(1, Math.max(0, ratio)));
        }
        function handleTimerEnd() {
            if (currentMode.id === 'breathing') {
                breathingPhaseIdx++;
                if (breathingPhaseIdx >= breathingPhases.length) {
                    breathingPhaseIdx = 0;
                    breathingCycle++;
                    if (breathingCycle >= breathingMaxCycles) { endSession(true); return; }
                }
                const nextPhase = breathingPhases[breathingPhaseIdx];
                timeLeft = nextPhase.duration;
                totalDuration = timeLeft;
                updateDisplay();
                updateProgress(1);
                updateBreathingUI();
                playSound('tick');
                return;
            }
            if (!isBreak && totalRounds > 1 && currentRound < totalRounds && getBreakDuration() > 0) {
                isBreak = true;
                currentRound++;
                timeLeft = getBreakDuration();
                totalDuration = timeLeft;
                updateDisplay();
                updateProgress(1);
                playSound('tick');
            } else {
                endSession(true);
            }
        }
        function getBreakDuration() {
            if (!currentMode) return 300;
            const d = currentMode.defaults;
            if (currentMode.id === 'pomodoro') return (currentRound % 4 === 0 ? d.longBreak : d.break) * 60;
            if (currentMode.id === 'interval') return d.break * 60;
            if (currentMode.id === 'workout') return d.rest;
            return d.break ? d.break * 60 : 0;
        }
        function skipBreak() {
            if (!isBreak || !currentMode) return;
            isBreak = false;
            const focus = currentMode.id === 'workout' ? currentMode.defaults.exercise : currentMode.defaults.focus * 60;
            timeLeft = focus;
            totalDuration = focus;
            updateDisplay();
            updateProgress(1);
        }
        function addFiveMinutes() {
            if (!currentMode || currentMode.id === 'stopwatch' || currentMode.id === 'breathing') return;
            timeLeft += 300;
            totalDuration += 300;
            updateDisplay();
            updateProgress(timeLeft / totalDuration);
        }
        function resetTimer() {
            startMode(currentMode.id);
            updateDisplay();
            updateProgress(1);
            if (isRunning) stopTimer();
        }
        function endSession(completed = true) {
            stopTimer();
            cancelAnimationFrame(animFrame);
            if (completed && currentMode) {
                const durMin = Math.round((totalDuration - timeLeft) / 60);
                const session = { mode: currentMode.name, duration: durMin, date: new Date().toISOString(), score: sessionData.score || 100 };
                saveHistory(session);
                document.getElementById('summaryDetails').innerHTML = `
                    <p><strong>${session.mode}</strong></p>
                    <p>Duration: ${durMin} minutes</p>
                    <p>Focus Score: ${session.score}%</p>`;
                document.getElementById('summaryModal').classList.add('active');
            }
            if (currentMode) {
                timeLeft = 0;
                totalDuration = 0;
                updateDisplay();
                updateProgress(1);
            }
            document.title = 'Fikr Timer';
        }
        document.getElementById('closeSummary').addEventListener('click', () => {
            document.getElementById('summaryModal').classList.remove('active');
        });

        // ===================== ANALYTICS VIEW =====================
        function renderAnalytics() {
            const history = JSON.parse(localStorage.getItem('fikr_history') || '[]');
            const todayStr = new Date().toDateString();
            const todaySessions = history.filter(s => new Date(s.date).toDateString() === todayStr);
            const todayMin = todaySessions.reduce((sum, s) => sum + (s.duration || 0), 0);
            const streak = calcStreak(history);
            main.innerHTML = `
                <div class="view active">
                    <h2>Analytics</h2>
                    <div style="display:flex; gap:20px; margin:20px 0;">
                        <div style="flex:1; background:var(--surface); padding:16px; border-radius:16px;">
                            <div style="font-size:1.8rem;">${todayMin}m</div><small>Today Focus</small>
                        </div>
                        <div style="flex:1; background:var(--surface); padding:16px; border-radius:16px;">
                            <div style="font-size:1.8rem;">${todaySessions.length}</div><small>Sessions</small>
                        </div>
                        <div style="flex:1; background:var(--surface); padding:16px; border-radius:16px;">
                            <div style="font-size:1.8rem;">${streak}🔥</div><small>Streak</small>
                        </div>
                    </div>
                    <h3>Last 30 Days Heatmap</h3>
                    <div class="heatmap" id="heatmap"></div>
                    <h3>Recent Sessions</h3>
                    <div id="historyList">${history.slice(0,10).map(s => `
                        <div class="history-item">
                            <span>${s.mode}</span><span>${s.duration}m</span>
                            <small>${new Date(s.date).toLocaleDateString()}</small>
                        </div>`).join('') || '<p>No sessions yet.</p>'}</div>
                    <button class="btn" id="clearHistory" style="margin-top:10px;">Clear History</button>
                </div>`;
            // Heatmap
            const heatmapDiv = document.getElementById('heatmap');
            for (let i = 29; i >= 0; i--) {
                const d = new Date(Date.now() - i*86400000).toDateString();
                const min = history.filter(s => new Date(s.date).toDateString() === d).reduce((sum, s) => sum + (s.duration||0), 0);
                const cell = document.createElement('div');
                cell.className = 'heat-cell';
                cell.style.background = min > 0 ? `rgba(124,92,231,${Math.min(1, min/60)})` : 'var(--border)';
                cell.title = `${d}: ${min}m`;
                heatmapDiv.appendChild(cell);
            }
            document.getElementById('clearHistory').addEventListener('click', () => {
                if (confirm('Clear all history?')) {
                    localStorage.removeItem('fikr_history');
                    renderView();
                }
            });
        }
        function calcStreak(history) {
            const dates = [...new Set(history.map(s => new Date(s.date).toDateString()))].sort().reverse();
            let streak = 0;
            const today = new Date().toDateString();
            if (dates.length === 0) return 0;
            if (dates[0] !== today && dates[0] !== new Date(Date.now() - 86400000).toDateString()) return 0;
            for (let i = 0; i < dates.length; i++) {
                const d = new Date(dates[i]), expected = new Date(Date.now() - i * 86400000);
                if (d.toDateString() === expected.toDateString()) streak++;
                else break;
            }
            return streak;
        }

        // ===================== KEYBOARD SHORTCUTS =====================
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.code === 'Space') { e.preventDefault(); toggleTimer(); }
            if (e.code === 'KeyR') resetTimer();
            if (e.code === 'Equal' && e.shiftKey) addFiveMinutes();
        });

        document.getElementById('themeBtn').addEventListener('click', () => {
            const html = document.documentElement;
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });

        // Start
        renderView();
    </script>
</body>
</html>
